
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>エイプ！エイプ！エイプ！ FOOD & DRINK</title>

  <meta name="description" content="劇団ヨアガキ 新作公演『エイプ！エイプ！エイプ！』フード＆ドリンクメニュー">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="header">
      <p class="theater">劇団ヨアガキ 新作公演</p>

      <h1>エイプ！エイプ！エイプ！</h1>

      <p class="subtitle">FOOD & DRINK</p>
    </header>

    <section class="menu">

      <div class="menu-heading">
        <span>✳</span>
        MENU
        <span>✳</span>
      </div>

      <!-- プレートセット -->

      <section class="menu-section">

        <div class="section-heading">
          <h2>プレートセット</h2>
          <span class="price">￥1,000</span>
        </div>

        <p class="section-note">FOOD PLATE</p>

        <ul class="food-list">
          <li>豆カレー＆ライス</li>
          <li>角煮</li>
          <li>クミンキャロットラペ</li>
          <li>じゃがいものアチャール</li>
        </ul>

      </section>

      <!-- ドリンク -->

      <section class="menu-section">

        <div class="section-heading">
          <h2>ドリンク各種</h2>
        </div>

        <p class="section-note">DRINK MENU</p>

        <div class="drink-group">

          <span class="price">￥600</span>

          <ul class="drink-list">
            <li>ホワイトホースハイボール</li>
            <li>赤ワイン</li>
            <li>白ワイン</li>
            <li>ビール</li>
          </ul>

        </div>

        <div class="drink-group">

          <span class="price">￥400</span>

          <ul class="drink-list">
            <li>お茶</li>
            <li>オレンジジュース</li>
            <li>カルピス</li>
          </ul>

        </div>

      </section>

    </section>

    <footer>
      <p>GEKIDAN YOAGAKI</p>
    </footer>

  </main>

</body>
</html>
